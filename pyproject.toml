[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad2revit-mcp"
version = "0.2.1"
description = "LLM-driven 2D CAD to Revit BIM conversion exposed as MCP tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lizhengyang-byte" }]
keywords = ["mcp", "revit", "cad", "dxf", "bim", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "mcp>=1.0,<2",  # 2.x renamed FastMCP to MCPServer; this code targets the 1.x API
  "ezdxf>=1.0",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
cad2revit-mcp = "cad2revit_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/lizhengyang-byte/cad2revit-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.setuptools.package-data]
cad2revit_mcp = ["rules/*.json"]
